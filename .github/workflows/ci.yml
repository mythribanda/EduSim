name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI (EduSim_API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduSim_API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: EduSim_API/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes pytest pytest-asyncio

      - name: Run Pyflakes
        run: |
          python -m pyflakes main.py app curriculum_pipeline scripts tests

      - name: Run Pytest
        env:
          USE_CLOUD_AI: "true"
          DATABASE_URL: "sqlite:///ci_test.db"
          JWT_SECRET: "ci-secret-token-key-for-testing-at-least-32-chars-long"
          JWT_SECRET_KEY: "ci-secret-token-key-for-testing-at-least-32-chars-long"
          SECRET_KEY: "ci-secret-token-key-for-testing-at-least-32-chars-long"
          OPENROUTER_API_KEY: "mock-openrouter-key"
        run: |
          pytest -q

  frontend:
    name: Frontend CI (EduSim_frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduSim_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: EduSim_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit
