services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Version 16)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: edusim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edusim_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-edusim}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edusim}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edusim_net

  # ---------------------------------------------------------------------------
  # EduSim_API (FastAPI Backend)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./EduSim_API
      dockerfile: Dockerfile
    container_name: edusim_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-edusim_secret_password}@postgres:5432/${POSTGRES_DB:-edusim}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${JWT_SECRET}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      ALLOWED_ORIGINS: http://localhost:8080,http://frontend:8080
      FRONTEND_URL: http://localhost:8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      ALLOW_CLOUD_FALLBACK: ${ALLOW_CLOUD_FALLBACK:-false}
      TEXTBOOKS_DIR: /data/textbooks
      FAISS_INDEX_V2_DIR: /app/faiss_index_v2
      USE_CLOUD_AI: ${USE_CLOUD_AI:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./EduSim_API/textbooks:/data/textbooks:ro
      - faiss_index_v2_data:/app/faiss_index_v2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/db/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edusim_net

  # ---------------------------------------------------------------------------
  # EduSim_frontend (Single React/Vite/Bun Frontend)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./EduSim_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}}
    container_name: edusim_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      VITE_API_URL: http://localhost:8001
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edusim_net

  # ---------------------------------------------------------------------------
  # Optional Ollama Local LLM Inference Service (Behind compose profile)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: edusim_ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - edusim_net

# -----------------------------------------------------------------------------
# Named Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: edusim_postgres_data
  faiss_index_v2_data:
    name: edusim_faiss_index_v2_data
  ollama_data:
    name: edusim_ollama_data

networks:
  edusim_net:
    name: edusim_net
    driver: bridge
